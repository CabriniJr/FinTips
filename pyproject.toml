[project]
name = "fintips"
version = "0.6.0"
description = "Motor financeiro pessoal: extrato -> objetos -> causas -> perfil, score, custos fixos, planos, projeção e alavancas, com painel local e agente Claude"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
# O SDK 2.x renomeou FastMCP para MCPServer e mudou a API de registro.
# Enquanto `mcp_server.py` não migrar, o teto evita que `pip install`
# resolva para uma versão que não importa.
mcp = ["mcp>=1.2.0,<2"]
tudo = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9", "mcp>=1.2.0,<2"]

[project.scripts]
fintips = "fintips.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fintips*"]

[tool.setuptools.package-data]
fintips = ["rules/*.yaml", "web/index.html", "web/assets/*"]
