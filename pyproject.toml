[project]
name = "fintips"
version = "0.1.0"
description = "Motor financeiro pessoal: extrato -> YAML canônico -> score, planos e consultoria de compra"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]

[project.scripts]
fintips = "fintips.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fintips*"]

[tool.setuptools.package-data]
fintips = ["rules/*.yaml"]
