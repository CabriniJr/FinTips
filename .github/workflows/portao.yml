# O portão de push, automatizado.
#
# É exatamente a sequência que se roda à mão antes de commitar, e ela está aqui
# por um motivo concreto, descoberto errando: depois de um merge, o ouro no
# disco descrevia uma versão anterior do motor Python e **nada cobrava**. A
# suíte passava verde contra um ouro velho, e os dois motores se afastavam em
# silêncio — que é precisamente o que o harness diferencial existe para
# impedir. `gerar-ouro.py --conferir` é a trava, e trava que só roda quando
# alguém lembra não é trava.
#
# O `check-pii.sh` está aqui pelo motivo mais forte do projeto: `data/` guarda
# salário, empregador, nome de gente e hora de dormir, e já houve duas frases
# do plano pessoal vazando para dentro de fixture de teste. Em colisão entre o
# repositório e o arquivo pessoal, **o Git cede**.
name: portão

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp:
    name: conector MCP comum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test integracoes/mcp/*.test.mjs
      - run: npm ci --prefix integracoes/ponte
      - run: node --test integracoes/ponte/*.test.mjs
      - run: docker build -f integracoes/ponte/Dockerfile -t fintips-ponte:qa .
      - run: python3 scripts/verificar-ponte-container.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[mcp]"
      - run: python scripts/verificar-mcp-sdk.py

  motor:
    name: motor Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: instalar
        run: pip install -e ".[tudo]" pytest "jsonschema>=4.18,<5"
      - name: testes
        run: python -m pytest tests/ -q
      - name: contratos de triagem gerados conferem
        run: python scripts/gerar-contratos-triagem.py --conferir
      - name: contrato proposto do agente permanece estruturalmente válido
        run: python scripts/verificar-contrato-agente-proposto.py
      - name: ouro em paridade com o Python
        run: python scripts/gerar-ouro.py --conferir
      - name: nenhum dado pessoal nos arquivos versionados
        run: bash scripts/check-pii.sh --all
      # A tela de licenças é declaração legal: a Play Store cobra as
      # atribuições e as próprias licenças exigem o aviso junto do binário.
      # Uma lista escrita à mão envelhece em semanas — aqui ela é derivada dos
      # manifestos, e esta linha é o que impede a derivação de divergir.
      - name: licenças declaradas batem com os manifestos
        run: python -m fintips.cli config --conferir

  kotlin:
    name: motor Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Sem a flag Android: o motor tem de continuar puro, e é esta linha que
      # prova. Se um dia ela precisar do SDK para passar, a separação quebrou.
      - name: jvmTest sem o alvo Android
        working-directory: kotlin
        run: ./gradlew :motor:jvmTest :conector:test :conector:classpathDeTeste --no-daemon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[mcp]"
      - run: python scripts/verificar-mcp-local-sdk.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integracoes/ponte/package-lock.json
      - run: npm ci --prefix integracoes/ponte
      - run: python scripts/verificar-ponte-mcp-sdk.py

  painel:
    name: painel web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  triagem-ui:
    name: triagem móvel e privacidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :conector:classpathDeTeste --no-daemon
        working-directory: kotlin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright==1.62.0
      - name: Extrato registrado e contexto nas abas (bridge simulado)
        run: python scripts/verificar-extrato-ui.py
      - name: Conversa até os registros, com Kotlin e HTTPS reais
        run: python scripts/verificar-triagem-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triagem-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            kotlin/conector/build/reports/triagem-ui/
            kotlin/conector/build/reports/extrato-ui/
          if-no-files-found: warn
