# Build contínuo e releases Android pelo token do runner.
# A compilação de branches/PRs está em android-ci.yml; publicação usa a chave
# das alphas anteriores e confere a assinatura antes de oferecer atualização.
#
# Dois modos, de propósito:
#
#   push na main        → atualiza a pré-release rolante `android-main`, que é
#                         sempre o último build da main. É o "quero baixar o
#                         que está pronto agora", sem cerimônia de versão.
#   tag `android-v*`    → cria a release versionada daquela tag, imutável.
#
# Publicação exige a chave das alphas anteriores. CI de branches/PRs fica
# em android-ci.yml, sem acesso à chave e com pacote com.fintips.app.ci.
name: android

on:
  push:
    # Sem filtro de caminho de propósito: `paths` junto de `tags` compara
    # contra os arquivos do commit da tag, o que é imprevisível. Build de APK
    # é barato perto de uma release que não sai quando devia.
    branches: [main]
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag da release (vazio = rolante android-main)"
        required: false
        default: ""
      check_signing_only:
        description: "Conferir o secret do environment Fintips sem compilar/publicar"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Publicações são serializadas e não canceladas no meio do upload. Um build
# rolante que ficou atrás da main é descartado antes de alterar a release.
concurrency:
  group: android-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'rolante' }}
  cancel-in-progress: false

jobs:
  assinatura:
    if: github.event_name == 'workflow_dispatch' && inputs.check_signing_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Fintips
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Conferir a chave das alphas sem revelar o secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          EXPECTED_CERT: 3b2b3a83eec0f218c80f27541a3e27a918d87f7ecda890aecb2e5afbf3afc467
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 não está disponível no environment Fintips."
            exit 1
          fi
          umask 077
          CHECK_DIR=$(mktemp -d)
          trap 'rm -rf "$CHECK_DIR"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$CHECK_DIR/debug.keystore"
          keytool -exportcert -keystore "$CHECK_DIR/debug.keystore" \
            -alias androiddebugkey -storepass android > "$CHECK_DIR/certificate.der"
          CERT=$(sha256sum "$CHECK_DIR/certificate.der" | cut -d' ' -f1)
          if [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::Certificado diferente das alphas; não publicar uma atualização com esta chave."
            exit 1
          fi
          echo 'Chave do environment disponível e compatível com as alphas.'
          echo "Certificado público SHA-256: $CERT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Assinatura conferida. Nenhum APK ou release foi alterado.' >> "$GITHUB_STEP_SUMMARY"

  apk:
    if: (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && !inputs.check_signing_only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Fintips
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: conferir motor, ouro e PII antes da publicação
        run: |
          pip install -e ".[tudo]" pytest
          python -m pytest tests/ -q
          python scripts/gerar-ouro.py --conferir
          bash scripts/check-pii.sh --all
          python -m fintips.cli config --conferir

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: reconstruir a UI embarcada
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: conferir que o SDK Android existe no runner
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME não está definido no runner."
            echo "A imagem ubuntu-latest costuma trazer o SDK. Se isso mudou,"
            echo "acrescente um passo de instalação do SDK antes deste."
            exit 1
          fi
          echo "SDK em $ANDROID_HOME"

      # A chave de assinatura, quando ela existe. Fica fora do repositório:
      # chave privada em Git é chave privada publicada.
      - name: preparar a chave de assinatura
        id: chave
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            umask 077
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "FINTIPS_SIGNING_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
            echo "propria=true" >> "$GITHUB_OUTPUT"
            echo "Chave do environment instalada; a compatibilidade será conferida no APK."
          else
            echo "::error::Configure ANDROID_KEYSTORE_BASE64 com a chave das alphas anteriores."
            echo "Publicação bloqueada para preservar a atualização e os registros locais."
            exit 1
          fi

      - name: compilar
        working-directory: kotlin
        run: ./gradlew -Pfintips.android=true :motor:jvmTest :conector:test :app:assembleDebug :app:assembleRelease --no-daemon

      - name: verificar o APK e os assets embarcados
        env:
          FINTIPS_VERIFY_ONLY: "true"
          FINTIPS_EXPECTED_PACKAGE: com.fintips.app.ui
          FINTIPS_EXPECTED_CERT: 3b2b3a83eec0f218c80f27541a3e27a918d87f7ecda890aecb2e5afbf3afc467
        run: python3 scripts/verificar-apk.py

      - name: juntar os arquivos da release
        id: pacote
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find kotlin/app/build/outputs/apk/debug -name "*.apk" | head -1)
          VERSAO="$REQUESTED_TAG"
          if [ -z "$VERSAO" ] && [ "$REF_TYPE" = tag ]; then
            VERSAO="$REF_NAME"
          fi
          if [ -n "$VERSAO" ] && [[ ! "$VERSAO" =~ ^android-v[0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Tag inválida; use android-v seguido da versão."
            exit 1
          fi
          if [ -n "$VERSAO" ] && git rev-parse "refs/tags/$VERSAO" >/dev/null 2>&1; then
            if [ "$(git rev-parse "refs/tags/$VERSAO^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::A tag aponta para outro commit; use o build da tag."
              exit 1
            fi
          fi
          ROLANTE=false
          if [ -z "$VERSAO" ]; then
            VERSAO="android-main"
            ROLANTE=true
          fi
          # A tag já começa com "android-"; sem tirar o prefixo o arquivo sai
          # "FinTips-Android-android-main.apk".
          NOME="FinTips-Android-${VERSAO#android-}.apk"
          cp "$APK" "dist/$NOME"

          # A impressão digital do certificado é o que decide se o APK instala
          # por cima do anterior. Ela vai para a release para que qualquer um
          # possa conferir antes de instalar — e para que uma troca silenciosa
          # de chave fique visível no histórico de releases.
          # `apksigner`, não `keytool -printcert -jarfile`: com minSdk 26 o AGP
          # desliga a assinatura v1 (JAR), e aí o keytool não acha certificado
          # nenhum num APK que está perfeitamente assinado em v2/v3.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f \
                      | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner não encontrado em $ANDROID_HOME/build-tools"
            exit 1
          fi
          CERT=$("$APKSIGNER" verify --print-certs "dist/$NOME" \
                 | grep -m1 -i "SHA-256 digest" | awk '{print $NF}' | tr 'A-F' 'a-f')
          if [ -z "$CERT" ]; then
            echo "::error::não consegui ler a impressão digital do certificado"
            exit 1
          fi

          ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )
          APK_SHA=$(cd dist && sha256sum "$NOME" | cut -d' ' -f1)

          cat > dist/build-info.json <<JSON
          {
            "tag": "${VERSAO}",
            "rolante": ${ROLANTE},
            "commit": "${{ github.sha }}",
            "construido_em": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "variante": "debug",
            "apk_sha256": "${APK_SHA}",
            "certificado_sha256": "${CERT}",
            "assinado_com_chave_do_repositorio": ${{ steps.chave.outputs.propria }},
            "testado_em_aparelho": false,
            "jdk": "17"
          }
          JSON

          {
            echo "versao=$VERSAO"
            echo "rolante=$ROLANTE"
            echo "apk=$NOME"
            echo "cert=$CERT"
          } >> "$GITHUB_OUTPUT"

      - name: escrever as notas
        run: |
          set -euo pipefail
          {
            echo "![FinTips Android](${{ github.server_url }}/${{ github.repository }}/raw/${{ github.sha }}/docs/identidade/banner-release.png)"
            echo
            if [ "${{ steps.pacote.outputs.rolante }}" = "true" ]; then
              echo "Build automático do último commit da \`main\`."
              echo "Esta pré-release é **rolante**: ela é substituída a cada push."
              echo "Para uma versão que não se mexe, use uma tag \`android-v*\`."
            else
              echo "Release da tag \`${{ steps.pacote.outputs.versao }}\`."
            fi
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- certificado: \`${{ steps.pacote.outputs.cert }}\`"
            echo
            echo "Assinatura compatível com as alphas anteriores; instale por cima para manter os registros."
            echo "## O que este APK é, e o que não é"
            echo
            echo "Variante **debug**, com a UI web embarcada em WebView."
            echo "Não é a tela Compose nativa, e a compilação não prova fluidez,"
            echo "seletor de arquivos nem lifecycle no aparelho."
            echo
            echo "Motor Kotlin ligado à UI: frentes do dia, ritmo de leitura e conferência de saldo OFX."
            echo "As finanças ainda não oferecem classificação, score ou histórico no APK."
            echo
            echo "Servidor MCP Kotlin embarcado no celular, somente em 127.0.0.1 e com token por sessão."
            echo "Inicie/encerre em Contexto → Servidor IA local. Serviço com notificação de controle."
            echo "Preview 7: ponte HTTPS/OAuth comum para ChatGPT e Claude, com WSS de saída pelo Android."
            echo "Cada consulta chega ao mesmo MCP local; não há snapshot remoto reutilizado."
            echo "Aprovação e revogação por conector; somente indicadores revisados saem do telefone."
            echo "Registros completos, nomes, títulos, OFX e credenciais das fontes ficam locais."
            echo "Pausa, offline, fonte inválida e contexto vencido retornam indisponibilidade."
            echo "Hospedagem HTTPS e autorização nas contas reais ainda precisam ser ativadas."
            echo "Veja integracoes/ponte/README.md e o blueprint render.yaml para implantação."
            echo "Nenhum domínio externo vem configurado; abrir o site da IA não conclui o vínculo."
            echo "Credenciais da ponte são efêmeras: reinício do processo exige nova sessão."
            echo "Sem atualização local por uma hora, a ferramenta informa indisponibilidade."
            echo "A UI continua WebView com assets locais; não há analytics."
            echo
            echo "Confira o download com \`sha256sum -c SHA256SUMS.txt\`."
          } > dist/NOTAS.md

      - name: publicar ou atualizar a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.pacote.outputs.versao }}
          ROLANTE: ${{ steps.pacote.outputs.rolante }}
        run: |
          set -euo pipefail
          if [ "$ROLANTE" = true ]; then
            ATUAL=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$ATUAL" != "$GITHUB_SHA" ]; then
              echo "Main avançou; build antigo não altera a release rolante."
              exit 0
            fi
          fi
          if gh release view "$VERSAO" >/dev/null 2>&1; then
            # A rolante é substituída; uma tag versionada já publicada não é
            # reescrita por acidente — quem baixou um arquivo com aquele nome
            # tem de continuar recebendo aquele arquivo.
            if [ "$ROLANTE" != "true" ]; then
              echo "::error::A release $VERSAO já existe e não é rolante."
              echo "Release versionada não se reescreve: apague-a à mão se foi"
              echo "mesmo isso que você quis, ou publique uma tag nova."
              exit 1
            fi
            # Os arquivos novos são enviados e conferidos antes de mover a tag.
            gh release upload "$VERSAO" dist/* --clobber
            mkdir -p downloaded
            gh release download "$VERSAO" --dir downloaded --pattern 'FinTips-Android-main.apk' --pattern 'SHA256SUMS.txt' --pattern 'build-info.json' --pattern 'NOTAS.md'
            for arquivo in dist/*; do cmp "$arquivo" "downloaded/$(basename "$arquivo")"; done
            git tag -f "$VERSAO" "$GITHUB_SHA"
            git push -f origin "refs/tags/$VERSAO"
            gh release edit "$VERSAO" --notes-file dist/NOTAS.md --prerelease
            # Limpar nomes antigos somente depois de confirmar o conjunto atual.
            gh release view "$VERSAO" --json assets --jq '.assets[].name' | while read -r velho; do
              [ -f "dist/$velho" ] || gh release delete-asset "$VERSAO" "$velho" --yes
            done
          else
            gh release create "$VERSAO" dist/* \
              --title "FinTips Android · $VERSAO" \
              --notes-file dist/NOTAS.md \
              --prerelease \
              --target "${{ github.sha }}"
          fi
          echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$VERSAO"
