# Build do APK e publicação da release.
#
# Este workflow existe porque a publicação não podia ser feita de outro jeito.
# Os dois agentes que trabalham neste repositório recebem 403 ao criar tag ou
# release — não por falta de permissão no repositório (um deles tem admin), mas
# porque o tipo de sessão de agente não permite esse ato. Pedir mais escopo de
# GitHub não destrava. Um workflow do Actions, sim: ele roda com o
# `GITHUB_TOKEN` do repositório e `contents: write`.
#
# Dois modos, de propósito:
#
#   push na main        → atualiza a pré-release rolante `android-main`, que é
#                         sempre o último build da main. É o "quero baixar o
#                         que está pronto agora", sem cerimônia de versão.
#   tag `android-v*`    → cria a release versionada daquela tag, imutável.
#
# ## O problema da assinatura, que não é detalhe
#
# O Android **recusa** instalar uma atualização assinada com chave diferente da
# instalada. A chave de depuração que o Gradle gera é criada na hora, na
# máquina de quem compila — então, sem intervenção, cada build do CI sairia com
# uma chave nova e cada atualização exigiria desinstalar o app, o que **apaga
# os registros locais**. Num app cujos dados só existem no aparelho, isso não é
# inconveniência: é perda de dado.
#
# Por isso: se o segredo `ANDROID_KEYSTORE_BASE64` existir, o build assina com
# ele e a continuidade está garantida. Se não existir, o build continua — mas a
# release sai dizendo, em letra visível, que aquele APK **não** instala por
# cima do anterior. O workflow não finge que está tudo bem.
name: android

on:
  push:
    # Sem filtro de caminho de propósito: `paths` junto de `tags` compara
    # contra os arquivos do commit da tag, o que é imprevisível. Build de APK
    # é barato perto de uma release que não sai quando devia.
    branches: [main]
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag da release (vazio = rolante android-main)"
        required: false
        default: ""

permissions:
  contents: write

# Dois pushes seguidos na `main` disparam dois builds que escrevem na MESMA
# release rolante — e aí quem termina por último vence, sem relação nenhuma com
# quem é o commit mais novo. A release poderia acabar anunciando um commit e
# servindo o APK de outro.
#
# `cancel-in-progress` só para a rolante: um build de tag versionada nunca é
# cancelado, porque ele é o artefato daquela versão e não existe "mais novo"
# que o substitua.
concurrency:
  group: android-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'rolante' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: conferir que o SDK Android existe no runner
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME não está definido no runner."
            echo "A imagem ubuntu-latest costuma trazer o SDK. Se isso mudou,"
            echo "acrescente um passo de instalação do SDK antes deste."
            exit 1
          fi
          echo "SDK em $ANDROID_HOME"

      # A chave de assinatura, quando ela existe. Fica fora do repositório:
      # chave privada em Git é chave privada publicada.
      - name: preparar a chave de assinatura
        id: chave
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "propria=true" >> "$GITHUB_OUTPUT"
            echo "Chave do repositório instalada: a atualização instala por cima."
          else
            echo "propria=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64. O Gradle vai gerar uma"
            echo "chave de depuração nova, e este APK NÃO instala por cima do"
            echo "anterior — atualizar exigiria desinstalar, apagando os registros."
          fi

      - name: compilar
        working-directory: kotlin
        run: ./gradlew -Pfintips.android=true :app:assembleDebug --no-daemon

      - name: juntar os arquivos da release
        id: pacote
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find kotlin/app/build/outputs/apk/debug -name "*.apk" | head -1)
          VERSAO="${{ github.event.inputs.tag }}"
          if [ -z "$VERSAO" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSAO="${{ github.ref_name }}"
          fi
          ROLANTE=false
          if [ -z "$VERSAO" ]; then
            VERSAO="android-main"
            ROLANTE=true
          fi
          # A tag já começa com "android-"; sem tirar o prefixo o arquivo sai
          # "FinTips-Android-android-main.apk".
          NOME="FinTips-Android-${VERSAO#android-}.apk"
          cp "$APK" "dist/$NOME"

          # A impressão digital do certificado é o que decide se o APK instala
          # por cima do anterior. Ela vai para a release para que qualquer um
          # possa conferir antes de instalar — e para que uma troca silenciosa
          # de chave fique visível no histórico de releases.
          # `apksigner`, não `keytool -printcert -jarfile`: com minSdk 26 o AGP
          # desliga a assinatura v1 (JAR), e aí o keytool não acha certificado
          # nenhum num APK que está perfeitamente assinado em v2/v3.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f \
                      | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner não encontrado em $ANDROID_HOME/build-tools"
            exit 1
          fi
          CERT=$("$APKSIGNER" verify --print-certs "dist/$NOME" \
                 | grep -m1 -i "SHA-256 digest" | awk '{print $NF}' | tr 'A-F' 'a-f')
          if [ -z "$CERT" ]; then
            echo "::error::não consegui ler a impressão digital do certificado"
            exit 1
          fi

          ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )
          APK_SHA=$(cd dist && sha256sum "$NOME" | cut -d' ' -f1)

          cat > dist/build-info.json <<JSON
          {
            "tag": "${VERSAO}",
            "rolante": ${ROLANTE},
            "commit": "${{ github.sha }}",
            "construido_em": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "variante": "debug",
            "apk_sha256": "${APK_SHA}",
            "certificado_sha256": "${CERT}",
            "assinado_com_chave_do_repositorio": ${{ steps.chave.outputs.propria }},
            "testado_em_aparelho": false,
            "jdk": "17"
          }
          JSON

          {
            echo "versao=$VERSAO"
            echo "rolante=$ROLANTE"
            echo "apk=$NOME"
            echo "cert=$CERT"
          } >> "$GITHUB_OUTPUT"

      # Se o repositório declarar qual certificado é o legítimo, o build cobra.
      # Uma troca de certificado quebra a atualização em cima para todo mundo
      # que já instalou, e é o tipo de coisa que ninguém percebe até receber a
      # reclamação.
      - name: conferir a continuidade do certificado
        env:
          ESPERADO: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          if [ -z "${ESPERADO:-}" ]; then
            echo "Variável ANDROID_CERT_SHA256 não definida — nada a conferir."
            echo "Defina-a com ${{ steps.pacote.outputs.cert }} para que o CI"
            echo "passe a cobrar a continuidade da assinatura."
            exit 0
          fi
          if [ "${ESPERADO,,}" != "${{ steps.pacote.outputs.cert }}" ]; then
            echo "::error::O certificado mudou."
            echo "  esperado: ${ESPERADO,,}"
            echo "  obtido:   ${{ steps.pacote.outputs.cert }}"
            echo "Um APK com certificado diferente NÃO instala por cima do"
            echo "anterior: quem já tem o app precisaria desinstalar, e isso"
            echo "apaga os registros locais. Build interrompido de propósito."
            exit 1
          fi
          echo "Certificado confere: a atualização instala por cima."

      - name: escrever as notas
        run: |
          set -euo pipefail
          {
            if [ "${{ steps.pacote.outputs.rolante }}" = "true" ]; then
              echo "Build automático do último commit da \`main\`."
              echo "Esta pré-release é **rolante**: ela é substituída a cada push."
              echo "Para uma versão que não se mexe, use uma tag \`android-v*\`."
            else
              echo "Release da tag \`${{ steps.pacote.outputs.versao }}\`."
            fi
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- certificado: \`${{ steps.pacote.outputs.cert }}\`"
            echo
            if [ "${{ steps.chave.outputs.propria }}" != "true" ]; then
              echo "> **Este APK não instala por cima do anterior.**"
              echo "> Ele foi assinado com uma chave de depuração gerada na hora,"
              echo "> porque o segredo \`ANDROID_KEYSTORE_BASE64\` não está"
              echo "> configurado. Atualizar exigiria desinstalar o app — e"
              echo "> desinstalar **apaga os registros**, que só existem no"
              echo "> aparelho. Veja \`docs/RELEASES-ANDROID.md\`."
              echo
            fi
            echo "## O que este APK é, e o que não é"
            echo
            echo "Variante **debug**, com a UI web embarcada em WebView."
            echo "Não é a tela Compose nativa, e a compilação não prova fluidez,"
            echo "seletor de arquivos nem lifecycle no aparelho."
            echo
            echo "Sem permissão \`INTERNET\`, sem analytics, sem upload."
            echo "Seus dados ficam no aparelho."
            echo
            echo "Confira o download com \`sha256sum -c SHA256SUMS.txt\`."
          } > dist/NOTAS.md

      - name: publicar ou atualizar a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.pacote.outputs.versao }}
          ROLANTE: ${{ steps.pacote.outputs.rolante }}
        run: |
          set -euo pipefail
          if gh release view "$VERSAO" >/dev/null 2>&1; then
            # A rolante é substituída; uma tag versionada já publicada não é
            # reescrita por acidente — quem baixou um arquivo com aquele nome
            # tem de continuar recebendo aquele arquivo.
            if [ "$ROLANTE" != "true" ]; then
              echo "::error::A release $VERSAO já existe e não é rolante."
              echo "Release versionada não se reescreve: apague-a à mão se foi"
              echo "mesmo isso que você quis, ou publique uma tag nova."
              exit 1
            fi
            # A tag rolante tem de andar com o commit. Sem isto, a release
            # mostra o APK novo e a tag aponta para o commit velho — e aí o
            # "fonte desta release" mente, que é pior do que não existir.
            git tag -f "$VERSAO" "${{ github.sha }}"
            git push -f origin "refs/tags/$VERSAO"
            gh release edit "$VERSAO" --notes-file dist/NOTAS.md --prerelease
            gh release upload "$VERSAO" dist/* --clobber
          else
            gh release create "$VERSAO" dist/* \
              --title "FinTips Android · $VERSAO" \
              --notes-file dist/NOTAS.md \
              --prerelease \
              --target "${{ github.sha }}"
          fi
          echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$VERSAO"
